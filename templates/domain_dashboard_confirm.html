{% extends "base_verify.html" %}

{% block title %}XposedOrNot: Confirm Your Sign-In{% endblock %}

{% block content %}
<div class="verify-card">
  <div class="icon-circle success" aria-hidden="true">
    <i class="fas fa-user-shield"></i>
  </div>
  <h1>Confirm Your Sign-In</h1>
  <p>Click below to continue to your XposedOrNot dashboard.</p>
  <p class="expiry-note"><i class="fas fa-clock"></i> This sign-in link is valid for 3 hours and can be used only once</p>
  <form id="confirm-form" method="post" action="{{ action_url }}">
    <button type="submit" class="cta-button"><i class="fas fa-tachometer-alt"></i> Continue to Dashboard</button>
  </form>
</div>
<script src="/static/js/confirm-login.js" defer></script>
{% endblock %}
