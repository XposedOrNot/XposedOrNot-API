name: Release with Build Provenance

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create release artifacts
        run: |
          # Create source tarball
          git archive --format=tar.gz --prefix=XposedOrNot-API-${GITHUB_REF#refs/tags/}/ ${GITHUB_REF#refs/tags/} > XposedOrNot-API-${GITHUB_REF#refs/tags/}.tar.gz

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: XposedOrNot-API-*.tar.gz

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" XposedOrNot-API-${GITHUB_REF#refs/tags/}.intoto.jsonl
          gh release upload "${GITHUB_REF#refs/tags/}" XposedOrNot-API-${GITHUB_REF#refs/tags/}.tar.gz XposedOrNot-API-${GITHUB_REF#refs/tags/}.intoto.jsonl --clobber
