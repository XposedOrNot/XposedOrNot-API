name: Bandit

on:
  push:
  pull_request:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"

    - name: Install Bandit
      run: |
        python -m pip install --require-hashes -r .github/requirements-pip.txt
        pip install --require-hashes -r .github/requirements-bandit.txt

    - name: Run Bandit gate
      run: |
        bandit -r api config models services utils main.py --severity-level high --confidence-level high

    - name: Generate full Bandit report
      if: always()
      run: |
        bandit -r api config models services utils main.py -f json -o bandit-report.json --exit-zero

    - name: Upload Bandit report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: bandit-report
        path: bandit-report.json
